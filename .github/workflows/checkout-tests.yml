name: HomeVexa checkout safety tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checkout-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: homevexa_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptestpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: PHP runtime for tests
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, pdo_mysql
          coverage: none
      - name: PHP syntax check
        run: find public private -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: JavaScript syntax check
        run: node --check public/assets/store.js
      - name: Python test syntax check
        run: python3 -m py_compile tests/cashfree_smoke.py
      - name: Mocked Cashfree sandbox and COD integration
        run: python3 -u tests/cashfree_smoke.py
